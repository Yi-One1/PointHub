[package]
name = "pointhub"
version = "0.7.0"
edition = "2021"
description = "积分枢纽 PointHub 桌面端"
authors = ["Yi-One1"]
license = "MIT"

[lib]
name = "pointhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# 只在 Rust 侧用来打开下载页 / 安装包，不从前端调用。
tauri-plugin-opener = "2"

ph-core = { path = "../../../crates/ph-core" }
ph-engine = { path = "../../../crates/ph-engine" }
ph-store = { path = "../../../crates/ph-store" }
ph-providers = { path = "../../../crates/ph-providers" }
ph-client = { path = "../../../crates/ph-client" }
ph-update = { path = "../../../crates/ph-update" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
chrono = "0.4"
rand = "0.8"

# 自启是纯桌面机制，安卓上这个 crate 根本不该被编译
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# 安卓 WorkManager 的后台任务通过 JNI 调进 Rust
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# 卸载清理要读/删 HKCU Run 里的自启项
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
